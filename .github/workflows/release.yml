name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Test & pack release
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a commit; see ci.yml.
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      # The version lives in gradle.properties (it names the APK's version and the library's). A tag that
      # says something else would publish artifacts under the wrong name, so stop before building.
      - name: Check the tag matches the version
        run: |
          version=$(grep '^spotflowVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match spotflowVersion=$version in gradle.properties. Bump the version, commit, and tag that commit."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages are installed
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Unit tests and public API check
        run: ./gradlew :spotflow-ble-gateway:testDebugUnitTest :app:testDebugUnitTest :spotflow-ble-gateway:apiCheck --stacktrace

      # The signing key is given to this one step only; the decoded keystore is removed before it ends.
      - name: Build the signed demo APK
        env:
          SPOTFLOW_KEYSTORE_BASE64: ${{ secrets.SPOTFLOW_KEYSTORE_BASE64 }}
          SPOTFLOW_KEYSTORE_PASSWORD: ${{ secrets.SPOTFLOW_KEYSTORE_PASSWORD }}
          SPOTFLOW_KEY_ALIAS: ${{ secrets.SPOTFLOW_KEY_ALIAS }}
          SPOTFLOW_KEY_PASSWORD: ${{ secrets.SPOTFLOW_KEY_PASSWORD }}
        run: |
          if [ -z "$SPOTFLOW_KEYSTORE_BASE64" ]; then
            echo "::error::SPOTFLOW_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned APK."
            exit 1
          fi
          export SPOTFLOW_KEYSTORE_FILE="$RUNNER_TEMP/spotflow.keystore"
          trap 'rm -f "$SPOTFLOW_KEYSTORE_FILE"' EXIT
          echo "$SPOTFLOW_KEYSTORE_BASE64" | base64 --decode > "$SPOTFLOW_KEYSTORE_FILE"
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        run: &setup_pnpm |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pnpm.tar.gz" https://github.com/pnpm/pnpm/releases/download/v11.27.0/pnpm-linux-x64.tar.gz
          echo "14ed04e631e4563abf3570dda1a365316683149a482b741a2db37e495f6b9cdb  $RUNNER_TEMP/pnpm.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$RUNNER_TEMP/pnpm.tar.gz" -C "$RUNNER_TEMP/pnpm-bin"
          echo "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

    # The bridge's prepack builds the release AAR and publishes it to build/maven-repo before
      # copying it into the npm package. The GitHub Release uses that same AAR and repository.
      - name: Test and pack both npm workspaces
        working-directory: react-native
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
          pnpm typecheck
          pnpm test
          bash scripts/pack-release.sh ../dist

      # The Maven repository is the way to consume the library: its POM carries the dependencies. The bare
      # .aar is attached too, for those who prefer to list the dependencies themselves (see the README).
      - name: Collect Android release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/spotflow-gateway-${GITHUB_REF_NAME}.apk"
          cp spotflow-ble-gateway/build/outputs/aar/spotflow-ble-gateway-release.aar \
             "dist/spotflow-ble-gateway-${GITHUB_REF_NAME}.aar"
          # The licence asks to be displayed with every copy: it travels with the library.
          cp LICENSE.md build/maven-repo/LICENSE.md
          (cd build/maven-repo && zip -qr "$GITHUB_WORKSPACE/dist/spotflow-ble-gateway-${GITHUB_REF_NAME}-maven.zip" .)
          cp LICENSE.md dist/LICENSE.md

      - name: Upload tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  npm-release:
    name: Stage on npm
    needs: github-release
    if: github.repository == 'spotflow-io/gateway-android'
    runs-on: ubuntu-latest
    # The `npm-release` environment accepts only runs for `v*` tags.
    # An npm maintainer must approve the staged packages before they go live.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        run: *setup_pnpm

      # No checkout, dependency install, or lifecycle scripts in the staging job.
      - name: Stage the packed bridge and BLE Manager driver
        shell: bash
        run: |
          shopt -s nullglob
          bridge=(./dist/spotflow-react-native-ble-gateway-[0-9]*.tgz)
          driver=(./dist/spotflow-react-native-ble-gateway-ble-manager-[0-9]*.tgz)
          if [[ ${#bridge[@]} != 1 || ${#driver[@]} != 1 ]]; then
            echo '::error::Expected one tarball for each npm package'
            exit 1
          fi
          {
            echo '### npm release staging'
            echo
            echo 'Review in npmjs.com → Staged Packages and approve the bridge before the BLE Manager driver with 2FA.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for archive in "${bridge[0]}" "${driver[0]}"; do
            pnpm stage publish "$archive" --registry https://registry.npmjs.org --tag latest --access public --ignore-scripts --no-git-checks
            printf -- "- Staged \`%s\`\n" "${archive##*/}" >> "$GITHUB_STEP_SUMMARY"
          done
