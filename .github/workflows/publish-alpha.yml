name: Publish npm alpha
run-name: Publish npm alpha of PR #${{ inputs.pr }}

# Publishes the npm alpha that CI built for a pull request: the tarballs of its latest successful CI run,
# under the `alpha` dist-tag. This job runs no code from the pull request, only pnpm on its tarballs.
# Publishing goes through npm trusted publishing: the `npm-alpha` environment accepts only runs from
# main, so only the reviewed version of this file can publish.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

jobs:
  publish:
    name: Publish alpha of PR #${{ inputs.pr }}
    if: github.repository == 'spotflow-io/gateway-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm-alpha
    permissions:
      actions: read # find the CI run and download its tarballs
      contents: read
      pull-requests: read
      id-token: write # npm trusted publishing
    env:
      PR: ${{ inputs.pr }}
    steps:
      - name: Find the PR's latest successful CI build
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! $PR =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Enter a positive pull request number.'
            exit 1
          fi
          read -r fork base head < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json isCrossRepository,baseRefName,headRefOid \
            --jq '"\(.isCrossRepository) \(.baseRefName) \(.headRefOid)"')
          if [[ $fork != false || $base != main ]]; then
            echo "::error::Only PRs into main from branches of this repository get alphas. Push a fork's reviewed commits to a branch here first."
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head" |
            jq -c --arg repo "$GITHUB_REPOSITORY" --argjson pr "$PR" \
              'first(.workflow_runs[] | select(.head_repository.full_name == $repo and any(.pull_requests[]; .number == $pr))) // empty')
          if [[ -z $run ]]; then
            echo "::error::CI has not passed for $head, the head of PR #$PR."
            exit 1
          fi
          jq -r '"run=\(.id)\nsuffix=\(.run_number).\(.run_attempt)"' <<< "$run" >> "$GITHUB_OUTPUT"

      - name: Download the tarballs CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-alpha
          path: dist
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pnpm.tar.gz" https://github.com/pnpm/pnpm/releases/download/v11.27.0/pnpm-linux-x64.tar.gz
          echo "14ed04e631e4563abf3570dda1a365316683149a482b741a2db37e495f6b9cdb  $RUNNER_TEMP/pnpm.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$RUNNER_TEMP/pnpm.tar.gz" -C "$RUNNER_TEMP/pnpm-bin"
          echo "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      # The bridge goes first: the driver's peer dependency pins its exact version.
      - name: Publish the bridge, then the BLE Manager driver
        env:
          CI_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.ci.outputs.run }}
          CI_SUFFIX: ${{ steps.ci.outputs.suffix }}
        shell: bash
        run: |
          shopt -s nullglob
          archives=()
          published=()
          for package in react-native-ble-gateway react-native-ble-gateway-ble-manager; do
            tarballs=(dist/spotflow-"$package"-[0-9]*.tgz)
            if [[ ${#tarballs[@]} != 1 ]]; then
              echo "::error::Expected one tarball of @spotflow/$package"
              exit 1
            fi
            # pnpm honors a manifest's publishConfig.registry ahead of --registry.
            if ! version=$(tar -xOzf "${tarballs[0]}" package/package.json |
              jq -er --arg name "@spotflow/$package" --arg suffix "-alpha.$PR.$CI_SUFFIX" \
                'select(.name == $name and .publishConfig == null) | .version | select(endswith($suffix))') ||
              [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Unexpected package name, version or publishConfig in ${tarballs[0]}"
              exit 1
            fi
            archives+=("./${tarballs[0]}")
            published+=("@spotflow/$package@$version")
          done
          for archive in "${archives[@]}"; do
            pnpm publish "$archive" --registry https://registry.npmjs.org --tag alpha --access public --ignore-scripts --ignore-pnpmfile --no-git-checks
          done
          {
            echo "Published the alpha of PR #$PR that [CI built]($CI_RUN). Install it with:"
            echo '~~~sh'
            echo "pnpm add --save-exact ${published[*]}"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
