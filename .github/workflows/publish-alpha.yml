name: Stage npm alpha
run-name: Stage npm alpha of PR #${{ inputs.pr }}

# Stages the npm alpha that CI built for a reviewed PR commit with the `alpha` dist-tag.
# The staging job runs no code from the pull request, only pnpm on its tarballs.
# The `npm-alpha` environment accepts only runs from main. An npm maintainer must approve
# the staged packages before they go live.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      head_sha:
        description: Full SHA of the reviewed PR head commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Identify reviewed alpha artifact
    if: github.repository == 'spotflow-io/gateway-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.ci.outputs.run }}
      suffix: ${{ steps.ci.outputs.suffix }}
      artifact_id: ${{ steps.ci.outputs.artifact_id }}
    steps:
      # Resolve the immutable artifact before the environment-gated job starts.
      - name: Find the successful CI build for the reviewed commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REVIEWED_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          if [[ ! $PR =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Enter a positive pull request number.'
            exit 1
          fi
          if [[ ! $REVIEWED_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Enter the full 40-character SHA of the reviewed PR commit.'
            exit 1
          fi
          read -r fork base head < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json isCrossRepository,baseRefName,headRefOid \
            --jq '"\(.isCrossRepository) \(.baseRefName) \(.headRefOid)"')
          if [[ $fork != false || $base != main ]]; then
            echo "::error::Only PRs into main from branches of this repository get alphas. Push a fork's reviewed commits to a branch here first."
            exit 1
          fi
          if [[ $head != "$REVIEWED_SHA" ]]; then
            echo "::error::PR #$PR is no longer at reviewed commit $REVIEWED_SHA. Review the current head before publishing."
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$REVIEWED_SHA" |
            jq -c --arg repo "$GITHUB_REPOSITORY" --arg sha "$REVIEWED_SHA" --argjson pr "$PR" \
              'first(.workflow_runs[] | select(.head_sha == $sha and .head_repository.full_name == $repo and any(.pull_requests[]; .number == $pr))) // empty')
          if [[ -z $run ]]; then
            echo "::error::CI has not passed for $REVIEWED_SHA, the reviewed head of PR #$PR."
            exit 1
          fi
          run_id=$(jq -r '.id' <<< "$run")
          suffix=$(jq -r '"\(.run_number).\(.run_attempt)"' <<< "$run")
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=npm-alpha" |
            jq -c '[.artifacts[] | select(.name == "npm-alpha" and .expired == false)] | select(length == 1) | .[0]')
          if [[ -z $artifact ]] || ! digest=$(jq -er '.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$artifact"); then
            echo "::error::CI run $run_id must have exactly one unexpired npm-alpha artifact with a SHA-256 digest."
            exit 1
          fi
          artifact_id=$(jq -r '.id' <<< "$artifact")
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          {
            printf 'run=%s\nsuffix=%s\nartifact_id=%s\n' "$run_id" "$suffix" "$artifact_id"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Alpha selected for staging'
            echo "- PR #$PR, reviewed commit: $REVIEWED_SHA"
            echo "- [CI run]($run_url), run number and attempt: $suffix"
            echo "- [Artifact $artifact_id]($run_url/artifacts/$artifact_id): $digest"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Stage alpha of PR #${{ inputs.pr }}
    needs: preflight
    runs-on: ubuntu-24.04
    environment: npm-alpha
    permissions:
      actions: read
      contents: read
      id-token: write # npm trusted publishing
    env:
      PR: ${{ inputs.pr }}
    steps:
      - name: Download the selected artifact by ID and verify its digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          digest-mismatch: error
          path: dist
          run-id: ${{ needs.preflight.outputs.run }}
          github-token: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pnpm.tar.gz" https://github.com/pnpm/pnpm/releases/download/v11.27.0/pnpm-linux-x64.tar.gz
          echo "14ed04e631e4563abf3570dda1a365316683149a482b741a2db37e495f6b9cdb  $RUNNER_TEMP/pnpm.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          tar -xzf "$RUNNER_TEMP/pnpm.tar.gz" -C "$RUNNER_TEMP/pnpm-bin"
          echo "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"

      - name: Stage the bridge and BLE Manager driver
        env:
          CI_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.preflight.outputs.run }}
          CI_SUFFIX: ${{ needs.preflight.outputs.suffix }}
        shell: bash
        run: |
          shopt -s nullglob
          archives=()
          specs=()
          for package in react-native-ble-gateway react-native-ble-gateway-ble-manager; do
            tarballs=(dist/spotflow-"$package"-[0-9]*.tgz)
            if [[ ${#tarballs[@]} != 1 ]]; then
              echo "::error::Expected one tarball of @spotflow/$package"
              exit 1
            fi
            # pnpm honors a manifest's publishConfig.registry ahead of --registry.
            if ! version=$(tar -xOzf "${tarballs[0]}" package/package.json |
              jq -er --arg name "@spotflow/$package" --arg suffix "-alpha.$PR.$CI_SUFFIX" \
                'select(.name == $name and .publishConfig == null) | .version | select(endswith($suffix))') ||
              [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Unexpected package name, version or publishConfig in ${tarballs[0]}"
              exit 1
            fi
            archives+=("./${tarballs[0]}")
            specs+=("@spotflow/$package@$version")
          done
          {
            echo "### npm alpha staging for PR #$PR ([CI build]($CI_RUN))"
            echo
            echo 'Review in npmjs.com → Staged Packages and approve the bridge before the BLE Manager driver with 2FA.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for i in "${!archives[@]}"; do
            pnpm stage publish "${archives[i]}" --registry https://registry.npmjs.org --tag alpha --access public --ignore-scripts --no-git-checks
            printf -- "- Staged \`%s\`\n" "${specs[i]}" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo 'After both packages are approved, install them with:'
            echo '~~~sh'
            echo "pnpm add --save-exact ${specs[*]}"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
