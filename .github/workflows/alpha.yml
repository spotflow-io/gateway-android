name: Build npm alpha

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  pack:
    # Do not use pull_request_target: packing executes the selected PR's build scripts.
    if: >-
      github.repository == 'spotflow-io/gateway-android' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'npm-alpha'
    name: Test & pack npm alpha
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages are installed
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set alpha versions in the build checkout
        run: |
          test "$(git rev-parse HEAD)" = "$PR_SHA"
          node react-native/scripts/prepare-alpha.mjs "$PR_NUMBER.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"

      - name: Android tests and public API check
        run: ./gradlew :spotflow-ble-gateway:testDebugUnitTest :app:testDebugUnitTest :spotflow-ble-gateway:apiCheck --stacktrace

      - name: Test and pack the npm workspaces
        working-directory: react-native
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          mkdir -p ../dist
          bash scripts/pack-release.sh ../dist

      # This workflow has no npm credentials or OIDC permission and cannot publish.
      - name: Upload alpha tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-alpha-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Record the source and package checksums
        run: |
          {
            printf 'Alpha for PR #%s, built from commit %s.\n\n' "$PR_NUMBER" "$PR_SHA"
            printf 'Maintainers only: review this commit and publish the two tarballs with --tag alpha.\n\n'
            printf '~~~text\n'
            sha256sum dist/*.tgz
            printf '~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"
